<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a New Password · CinemaTracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset-password.css">
</head>
<body>
    <div class="card">
        <h1>Set a New Password</h1>
        <div class="subtitle">Choose a new password for your account.</div>

        <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <div class="field">
            <label for="confirm-password">Retype new password</label>
            <input id="confirm-password" type="password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <ul class="rules" id="rules">
            <li data-rule="length"><span class="icon"></span> At least 8 characters</li>
            <li data-rule="upper"><span class="icon"></span> One uppercase letter (A–Z)</li>
            <li data-rule="lower"><span class="icon"></span> One lowercase letter (a–z)</li>
            <li data-rule="number"><span class="icon"></span> One number (0–9)</li>
            <li data-rule="special"><span class="icon"></span> One special character (!@#$…)</li>
            <li data-rule="match"><span class="icon"></span> Passwords match</li>
        </ul>

        <button class="submit" id="submit-btn" type="button" disabled>SUBMIT</button>

        <div class="status" id="status"></div>
        <div class="hint"><a href="index.html">← Back to CinemaTracker</a></div>
    </div>

    <script src="assets/js/reset-password.js"></script>
</body>
</html>
