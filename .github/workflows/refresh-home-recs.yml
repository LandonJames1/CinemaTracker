name: Daily "You Might Like" home recommendations

# Once a day, precomputes each user's "You Might Like" home-strip deck into the
# "Home Recommendations" table — the strip is a STABLE DAILY deck, so it's served from
# that row all day and never re-rolls while you browse.
#
# This is now CHEAP: `build_home_recs` scores the shared "Rec Pool" (built once a day for
# everyone by build-rec-pool.yml, which runs 30 min earlier) instead of crawling TMDB per
# user, and it does the user-independent reads once per run. It used to fire ~36 sequential
# TMDB calls PER USER — ~5,400 in one invocation at limit=150 — and time out, leaving most
# users with no row at all. Hence the much higher default limit below.
#
# A user the cron still hasn't reached (or a brand-new account) is NOT stranded: the client
# calls the `home_recs` edge action, which computes their deck on the spot and saves it.
#
# GitHub Actions is only the timer + HTTP trigger. Reuses the existing cron secrets.
on:
  schedule:
    - cron: '30 3 * * *'   # daily at 03:30 UTC (off-peak); tune as desired
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max users to refresh this run (stalest first)'
        required: false
        default: '500'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build_home_recs
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"action\":\"build_home_recs\",\"limit\":${{ github.event.inputs.limit || 500 }}}" \
            --fail-with-body
