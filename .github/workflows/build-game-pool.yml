name: Build games movie pool

# Manual job to fill the cached "Game Pool" (~1000 movies) used by the daily
# games. Loops the swift-api `build_game_pool` action across three buckets
# (most_voted / rating / trending), paging deeper each pass and enriching NEW
# candidates with real IMDb rating/votes via OMDb.
#
# OMDb caps at ~1000 requests/DAY (shared with the daily refresh-imdb cron), and
# every new movie costs exactly one OMDb call, so a single run is BUDGETED — it
# stops after MAX_OMDB_PER_RUN new movies (default 500). Run it again the NEXT day
# to do the next batch (the action skips movies already in the pool, so re-runs
# just continue where the last one left off). TMDB has no meaningful daily cap, so
# it isn't the bottleneck. After the pool reaches TARGET across a couple of days
# you never need this again.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target pool size (stop once reached)'
        required: false
        default: '1000'
      max_omdb_per_run:
        description: 'Max NEW movies to enrich this run (OMDb calls; ~500/day is safe)'
        required: false
        default: '500'
      pages_per_call:
        description: 'TMDB pages per call (each page ~20 movies)'
        required: false
        default: '3'
      limit_per_call:
        description: 'Max movies enriched per call'
        required: false
        default: '60'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build the game pool (budgeted per run)
        env:
          URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          APIKEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET: ${{ github.event.inputs.target || '1000' }}
          MAX_OMDB: ${{ github.event.inputs.max_omdb_per_run || '500' }}
          PAGES: ${{ github.event.inputs.pages_per_call || '3' }}
          LIMIT: ${{ github.event.inputs.limit_per_call || '60' }}
        run: |
          set -euo pipefail
          spent=0   # cumulative NEW movies enriched this run == OMDb calls made
          done=0
          for bucket in most_voted rating trending; do
            page=1
            for i in $(seq 1 40); do
              # Don't start another call if we'd blow the per-run OMDb budget.
              if [ "$spent" -ge "$MAX_OMDB" ]; then
                echo "Reached OMDb budget for this run ($spent / $MAX_OMDB). Stopping."
                done=1
                break
              fi
              echo "--- bucket=$bucket page_start=$page (omdb spent=$spent/$MAX_OMDB) ---"
              resp=$(curl -sS -X POST "$URL" \
                -H "Content-Type: application/json" \
                -H "apikey: $APIKEY" \
                -H "x-cron-secret: $CRON_SECRET" \
                -d "{\"action\":\"build_game_pool\",\"bucket\":\"$bucket\",\"page_start\":$page,\"pages\":$PAGES,\"limit\":$LIMIT,\"target\":$TARGET}" \
                --fail-with-body)
              echo "$resp"

              ok=$(echo "$resp" | jq -r '.ok // false')
              if [ "$ok" != "true" ]; then
                echo "::error::build_game_pool did not return ok:true"
                exit 1
              fi

              pool_total=$(echo "$resp" | jq -r '.pool_total // 0')
              next_page=$(echo "$resp" | jq -r '.next_page // 0')
              considered=$(echo "$resp" | jq -r '.considered // 0')
              enriched=$(echo "$resp" | jq -r '.enriched // 0')
              spent=$((spent + enriched))
              page=$next_page

              if [ "$pool_total" -ge "$TARGET" ]; then
                echo "Pool reached $pool_total (target $TARGET). Done."
                done=1
                break
              fi
              # If TMDB returned nothing for this page range, move to the next bucket.
              if [ "$considered" = "0" ]; then
                echo "No more candidates for bucket $bucket; next bucket."
                break
              fi
              sleep 2
            done
            if [ "$done" = "1" ]; then break; fi
          done
          echo "Pass complete. Enriched $spent new movies this run (pool now ~$pool_total)."
          if [ "$pool_total" -lt "$TARGET" ]; then
            echo "::notice::Pool is $pool_total / $TARGET — run this workflow again tomorrow to continue."
          fi
