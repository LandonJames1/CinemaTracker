name: Refresh IMDb ratings + watch options

# Runs daily and (1) re-pulls the 100 stalest IMDb ratings from OMDb and (2) re-pulls
# TMDb watch options (streaming platforms) for a batch of the stalest movies sitting in
# users' lists — both via the swift-api Edge Function, which does the actual DB writes
# with the service-role key. GitHub Actions is ONLY the timer + the HTTP trigger. Each
# batch rotates the catalog so we never blow the OMDb/TMDb rate limits in one run.
on:
  schedule:
    - cron: '0 8 * * *'   # every day at 08:00 UTC
  workflow_dispatch: {}     # also lets you run it on demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh_imdb_ratings
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"refresh_imdb_ratings","limit":100}' \
            --fail-with-body

      - name: Trigger refresh_list_watch_platforms
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"refresh_list_watch_platforms","limit":200}' \
            --fail-with-body
